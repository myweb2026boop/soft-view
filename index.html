<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>西西莉亚</title>
<style>
    :root {
        --bg-color: #f5f5f7;
        --card-bg: #ffffff;
        --text-main: #1c1c1e;
        --text-secondary: #8e8e93;
        --placeholder-bg: #e5e5ea;
        --border-color: #e5e5ea;
        --blue: #007aff;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        padding: 20px 12px;
        background-color: var(--bg-color);
        background-image: none;
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--text-main);
        display: flex;
        justify-content: center;
        min-height: 100vh;
        overflow-x: hidden;
        transition: background-image 0.3s ease;
    }

    /* 主页容器 */
    .app-container {
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
    }

    /* --- 顶部三个小方块区 --- */
    .widget-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        justify-items: center;
        margin-bottom: 20px;
        padding: 0 10px;
    }

    .widget-item {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .widget-box {
        width: 80px;
        height: 80px;
        background-color: var(--placeholder-bg);
        border-radius: 16px;
        cursor: pointer;
        background-size: cover;
        background-position: center;
        transition: opacity 0.2s;
        flex-shrink: 0;
    }
    
    .widget-box:active { opacity: 0.7; }

    .widget-label {
        margin-top: 8px;
        font-size: 14px;
        font-weight: 500;
        text-align: center;
        min-height: 18px;
    }

    /* --- 中间大白框 (帖子区) --- */
    .post-card {
        background-color: var(--card-bg);
        border-radius: 20px;
        padding: 16px;
        margin-bottom: 30px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }

    .post-header {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
    }

    .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background-color: var(--placeholder-bg);
        margin-right: 12px;
        cursor: pointer;
        background-size: cover;
        background-position: center;
        flex-shrink: 0;
    }

    .user-info { flex-grow: 1; }
    .username { font-size: 15px; font-weight: 600; display: flex; align-items: center; }
    .post-time { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
    .more-icon { color: var(--text-secondary); font-weight: bold; letter-spacing: 2px; }

    .post-content { font-size: 14px; line-height: 1.5; margin-bottom: 16px; }
    .post-content .translation { color: var(--blue); margin-top: 8px; font-size: 14px; }

    .post-actions {
        display: flex;
        justify-content: space-between;
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 500;
        border-top: 1px solid var(--border-color);
        padding-top: 12px;
    }

    .action-btn { display: flex; align-items: center; gap: 6px; }

    /* --- App 图标区 --- */
    .app-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        padding: 0 10px;
        margin-bottom: 30px;
    }

    .app-item {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .app-icon {
        width: 60px;
        height: 60px;
        background-color: var(--placeholder-bg);
        border-radius: 14px;
        margin-bottom: 8px;
        background-size: cover;
        background-position: center;
        cursor: pointer;
        transition: transform 0.1s;
    }
    .app-icon:active { transform: scale(0.95); }

    .app-name {
        font-size: 13px;
        color: var(--text-main);
        text-align: center;
        min-width: 40px;
    }

    /* --- 搜索栏 & 胶囊 --- */
    .search-container {
        display: flex;
        justify-content: center;
        margin-top: auto; 
        margin-bottom: 25px;
    }

    .search-bar {
        background-color: #e5e5ea;
        color: #8e8e93;
        border-radius: 20px;
        padding: 6px 16px;
        font-size: 14px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }

    .svg-icon-search { width: 16px; height: 16px; fill: #8e8e93; }

    .dock {
        background-color: rgba(209, 209, 214, 0.8);
        backdrop-filter: blur(10px);
        border-radius: 32px;
        padding: 12px;
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 10px;
    }

    .dock-icon {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background-color: #ffffff;
        background-size: cover;
        background-position: center;
        cursor: pointer;
    }

    /* ==================================================== */
    /* --- 全屏管理界面样式 --- */
    /* ==================================================== */
    #manager-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: var(--bg-color);
        z-index: 1000;
        display: none;
        flex-direction: column;
        padding: 20px;
        overflow-y: auto;
    }

    #manager-screen.active { display: flex; }

    .manager-header {
        display: flex;
        align-items: center;
        margin-bottom: 30px;
        padding: 0 10px;
    }

    .back-btn {
        background: none;
        border: none;
        font-size: 16px;
        color: var(--blue);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0;
    }

    .manager-title {
        flex-grow: 1;
        text-align: center;
        font-weight: 600;
        font-size: 17px;
        margin-right: 50px;
    }

    .manager-section-title {
        font-size: 14px;
        color: var(--text-secondary);
        margin: 20px 10px 10px;
        font-weight: 500;
    }

    .manager-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px 10px;
        padding: 0 10px;
    }
    
    .manager-grid.dock-grid {
        display: flex;
        justify-content: flex-start;
        gap: 30px;
    }

    .manager-grid.dock-grid .dock-icon {
        background-color: var(--placeholder-bg);
    }

    [contenteditable="true"] {
        outline: none;
        background-color: rgba(0, 122, 255, 0.1);
        border-radius: 4px;
        cursor: text;
    }

    /* 设置按钮区 */
    .settings-group {
        margin-top: 20px;
        padding: 0 10px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 40px;
    }

    .setting-btn {
        background-color: #ffffff;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 14px;
        font-size: 15px;
        color: var(--text-main);
        text-align: center;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        transition: background-color 0.2s;
    }
    .setting-btn:active { background-color: #f0f0f0; }

    /* 恢复类按钮使用警告色 */
    .setting-btn.danger {
        color: #ff3b30;
        border-color: #ffd6d6;
    }
    .setting-btn.danger:active {
        background-color: #fff0f0;
    }

    #file-upload { display: none; }
    #import-file { display: none; }
</style>
</head>
<body>

<input type="file" id="file-upload" accept="image/*">

<script>
    // ==========================================
    // 1. IndexedDB 大容量数据库封装 (未做任何重命名，确保兼容旧数据)
    // ==========================================
    const DB_NAME = 'AppImageDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'images';

    function initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME);
                }
            };
            request.onsuccess = (e) => resolve(e.target.result);
            request.onerror = (e) => reject(e.target.error);
        });
    }

    async function saveImageToDB(key, base64Data) {
        const db = await initDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const req = store.put(base64Data, key);
            req.onsuccess = () => resolve();
            req.onerror = (e) => reject(e.target.error);
        });
    }

    async function getImageFromDB(key) {
        const db = await initDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const req = store.get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = (e) => reject(e.target.error);
        });
    }

    // 新增：从DB中删除特定记录
    async function deleteImageFromDB(key) {
        const db = await initDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const req = store.delete(key);
            req.onsuccess = () => resolve();
            req.onerror = (e) => reject(e.target.error);
        });
    }

    async function getAllImagesFromDB() {
        const db = await initDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const req = store.getAll();
            const keysReq = store.getAllKeys();
            
            tx.oncomplete = () => {
                const result = {};
                for(let i=0; i<keysReq.result.length; i++) {
                    result[keysReq.result[i]] = req.result[i];
                }
                resolve(result);
            };
            tx.onerror = (e) => reject(e.target.error);
        });
    }

    async function clearImageDB() {
        const db = await initDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            store.clear();
            tx.oncomplete = () => resolve();
            tx.onerror = (e) => reject(e.target.error);
        });
    }

    // ==========================================
    // 2. 系统时间
    // ==========================================
    function updateLiveTime() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('live-time').innerText = `${hours}:${minutes}`;
    }
    setInterval(updateLiveTime, 1000);
    updateLiveTime();

    // ==========================================
    // 3. 管理界面开关
    // ==========================================
    const managerScreen = document.getElementById('manager-screen');
    function openManager() { managerScreen.classList.add('active'); }
    function closeManager() { managerScreen.classList.remove('active'); }

    // ==========================================
    // 4. App 数据配置与渲染
    // ==========================================
    const defaultApps = [
        { id: '1', name: '讯言', isDock: false },
        { id: '2', name: '见面', isDock: false },
        { id: '3', name: '通讯录', isDock: false },
        { id: '4', name: '桌面', isDock: false },
        { id: 'd1', name: '', isDock: true },
        { id: 'd2', name: '', isDock: true }
    ];

    async function renderApps() {
        for (const app of defaultApps) {
            const savedName = localStorage.getItem(`app_name_${app.id}`);
            const finalName = savedName !== null ? savedName : app.name;

            const savedImg = await getImageFromDB(`app_img_${app.id}`);

            if (!app.isDock) {
                const homeNameEl = document.getElementById(`home-name-${app.id}`);
                const homeIconEl = document.getElementById(`home-icon-${app.id}`);
                if (homeNameEl) homeNameEl.innerText = finalName;
                
                if (homeIconEl) {
                    if (savedImg) {
                        homeIconEl.style.backgroundImage = `url(${savedImg})`;
                    } else {
                        homeIconEl.style.backgroundImage = 'none'; // 恢复默认
                    }
                }
                
                const mgNameEl = document.getElementById(`mg-name-${app.id}`);
                const mgIconEl = document.getElementById(`mg-icon-${app.id}`);
                if (mgNameEl) mgNameEl.innerText = finalName;
                
                if (mgIconEl) {
                    if (savedImg) {
                        mgIconEl.style.backgroundImage = `url(${savedImg})`;
                    } else {
                        mgIconEl.style.backgroundImage = 'none';
                    }
                }
            } else {
                const homeDockEl = document.getElementById(`home-dock-${app.id === 'd1' ? '1' : '2'}`);
                const mgDockEl = document.getElementById(`mg-dock-${app.id === 'd1' ? '1' : '2'}`);
                
                if (homeDockEl) {
                    if (savedImg) homeDockEl.style.backgroundImage = `url(${savedImg})`;
                    else homeDockEl.style.backgroundImage = 'none';
                }
                if (mgDockEl) {
                    if (savedImg) mgDockEl.style.backgroundImage = `url(${savedImg})`;
                    else mgDockEl.style.backgroundImage = 'none';
                }
            }
        }
    }

    // ==========================================
    // 5. 文字双击编辑
    // ==========================================
    document.querySelectorAll('.manager-editable').forEach(el => {
        el.addEventListener('dblclick', function(e) {
            e.stopPropagation();
            this.contentEditable = "true";
            this.focus();
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(this);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
        });

        el.addEventListener('blur', function() {
            this.contentEditable = "false";
            const appId = this.dataset.target;
            const newName = this.innerText.trim();
            localStorage.setItem(`app_name_${appId}`, newName);
            document.getElementById(`home-name-${appId}`).innerText = newName;
        });
    });

    const editableElements = document.querySelectorAll('.editable');
    editableElements.forEach(el => {
        const key = el.dataset.key;
        const savedText = localStorage.getItem(key);
        if (savedText) el.innerHTML = savedText;

        el.addEventListener('dblclick', function(e) {
            e.stopPropagation();
            this.contentEditable = "true";
            this.focus();
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(this);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
        });

        el.addEventListener('blur', function() {
            this.contentEditable = "false";
            localStorage.setItem(key, this.innerHTML);
        });
    });

    // ==========================================
    // 6. 图片上传与壁纸逻辑
    // ==========================================
    const fileInput = document.getElementById('file-upload');
    let currentUploadTarget = null;

    document.querySelectorAll('.manager-upload-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            currentUploadTarget = { type: 'app', id: this.dataset.target };
            fileInput.click();
        });
    });

    function setupHomeImageUpload(elementId) {
        const el = document.getElementById(elementId);
        el.addEventListener('click', () => {
            currentUploadTarget = { type: 'other', id: elementId };
            fileInput.click();
        });
    }
    
    setupHomeImageUpload('widget-img-1');
    setupHomeImageUpload('widget-img-2');
    setupHomeImageUpload('widget-img-3');
    setupHomeImageUpload('avatar-img');

    document.getElementById('btn-change-wallpaper').addEventListener('click', () => {
        currentUploadTarget = { type: 'wallpaper', id: 'wallpaper' };
        fileInput.click();
    });

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file && currentUploadTarget) {
            const reader = new FileReader();
            reader.onload = async function(event) {
                const base64Data = event.target.result;
                let dbKey = '';

                if (currentUploadTarget.type === 'app') {
                    dbKey = `app_img_${currentUploadTarget.id}`;
                } else if (currentUploadTarget.type === 'wallpaper') {
                    dbKey = 'app_wallpaper';
                } else {
                    dbKey = `other_img_${currentUploadTarget.id}`;
                }

                await saveImageToDB(dbKey, base64Data);

                if (currentUploadTarget.type === 'app') {
                    await renderApps(); 
                } else if (currentUploadTarget.type === 'wallpaper') {
                    document.body.style.backgroundImage = `url(${base64Data})`;
                } else {
                    const el = document.getElementById(currentUploadTarget.id);
                    if (el) el.style.backgroundImage = `url(${base64Data})`;
                }
                
                fileInput.value = '';
            };
            reader.readAsDataURL(file);
        }
    });

    // ==========================================
    // 7. 导出/导入 & 恢复默认数据
    // ==========================================
    // 导出
    document.getElementById('btn-export').addEventListener('click', async () => {
        try {
            const lsData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                lsData[key] = localStorage.getItem(key);
            }
            const dbData = await getAllImagesFromDB();

            const exportPayload = {
                version: 1.0,
                timestamp: Date.now(),
                localStorage: lsData,
                indexedDB: dbData
            };

            const dataStr = "data:application/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportPayload));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", `desktop_beautify_${new Date().getTime()}.json`);
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            
            alert("导出成功！请保存好下载的 JSON 文件。");
        } catch (err) {
            console.error(err);
            alert("导出失败，请重试。");
        }
    });

    // 导入
    const importFileInput = document.getElementById('import-file');
    document.getElementById('btn-import').addEventListener('click', () => {
        importFileInput.click();
    });

    importFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(event) {
            try {
                const importedData = JSON.parse(event.target.result);
                
                if (!importedData.localStorage || !importedData.indexedDB) {
                    throw new Error("无效的美化文件格式");
                }

                await clearImageDB();
                localStorage.clear();
                
                for (const [key, value] of Object.entries(importedData.localStorage)) {
                    localStorage.setItem(key, value);
                }

                const imagePromises = [];
                for (const [key, base64] of Object.entries(importedData.indexedDB)) {
                    imagePromises.push(saveImageToDB(key, base64));
                }
                await Promise.all(imagePromises);

                alert("导入成功！点击确定后将刷新页面以应用新配置。");
                location.reload();

            } catch (err) {
                console.error(err);
                alert("导入失败：文件可能已损坏或格式不正确。");
            }
            importFileInput.value = '';
        };
        reader.readAsText(file);
    });

    // 恢复默认壁纸
    document.getElementById('btn-reset-wallpaper').addEventListener('click', async () => {
        if(confirm("确定要恢复默认桌面壁纸吗？")) {
            await deleteImageFromDB('app_wallpaper');
            localStorage.removeItem('wallpaper'); // 兼容清理
            document.body.style.backgroundImage = 'none';
        }
    });

    // 恢复默认图标与名称
    document.getElementById('btn-reset-apps').addEventListener('click', async () => {
        if(confirm("确定要将所有App（桌面及底部）恢复为默认的图标和名称吗？")) {
            // 1. 清理本地存储中的名字
            defaultApps.forEach(app => {
                localStorage.removeItem(`app_name_${app.id}`);
            });

            // 2. 清理数据库中的图标 (只删除App相关的，不删头像和组件)
            const keysToDelete = ['app_img_1', 'app_img_2', 'app_img_3', 'app_img_4', 'app_img_d1', 'app_img_d2'];
            for (let key of keysToDelete) {
                await deleteImageFromDB(key);
            }

            // 3. 重新渲染
            await renderApps();
            alert("已恢复默认图标和名称！");
        }
    });

    // ==========================================
    // 8. 初始化加载
    // ==========================================
    async function initApp() {
        await renderApps();
        
        const wallpaperImg = await getImageFromDB('app_wallpaper');
        if (wallpaperImg) {
            document.body.style.backgroundImage = `url(${wallpaperImg})`;
        }

        const avatarImg = await getImageFromDB('other_img_avatar-img');
        if (avatarImg) document.getElementById('avatar-img').style.backgroundImage = `url(${avatarImg})`;

        for (let i = 1; i <= 3; i++) {
            const widgetImg = await getImageFromDB(`other_img_widget-img-${i}`);
            if (widgetImg) document.getElementById(`widget-img-${i}`).style.backgroundImage = `url(${widgetImg})`;
        }

        const badgeSvg = `<svg style="width:16px;height:16px;fill:#007aff;margin-left:4px;vertical-align:middle;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>`;
        document.getElementById('verify-badge').innerHTML = badgeSvg;
    }

    initApp();
</script>
</body>
</html>
