<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>梨汁机</title>
<style>
    :root {
        --bg-color: #f5f5f7;
        --card-bg: #ffffff;
        --text-main: #1c1c1e;
        --text-secondary: #8e8e93;
        --placeholder-bg: #e5e5ea;
        --border-color: #e5e5ea;
        --blue: #007aff;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        padding: 20px 12px;
        background-color: var(--bg-color);
        background-image: none;
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--text-main);
        display: flex;
        justify-content: center;
        min-height: 100vh;
        overflow-x: hidden;
        transition: background-image 0.3s ease;
    }

    /* 主页容器 */
    .app-container {
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
    }

    /* --- 顶部三个小方块区 --- */
    .widget-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        justify-items: center;
        margin-bottom: 20px;
        padding: 0 10px;
    }

    .widget-item {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .widget-box {
        width: 80px;
        height: 80px;
        background-color: var(--placeholder-bg);
        border-radius: 16px;
        cursor: pointer;
        background-size: cover;
        background-position: center;
        transition: opacity 0.2s;
        flex-shrink: 0;
    }
    
    .widget-box:active { opacity: 0.7; }

    .widget-label {
        margin-top: 8px;
        font-size: 14px;
        font-weight: 500;
        text-align: center;
        min-height: 18px;
    }

    /* --- 中间大白框 (帖子区) --- */
    .post-card {
        background-color: var(--card-bg);
        border-radius: 20px;
        padding: 16px;
        margin-bottom: 30px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }

    .post-header {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
    }

    .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background-color: var(--placeholder-bg);
        margin-right: 12px;
        cursor: pointer;
        background-size: cover;
        background-position: center;
        flex-shrink: 0;
    }

    .user-info { flex-grow: 1; }
    .username { font-size: 15px; font-weight: 600; display: flex; align-items: center; }
    .post-time { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
    .more-icon { color: var(--text-secondary); font-weight: bold; letter-spacing: 2px; }

    .post-content { font-size: 14px; line-height: 1.5; margin-bottom: 16px; }
    .post-content .translation { color: var(--blue); margin-top: 8px; font-size: 14px; }

    .post-actions {
        display: flex;
        justify-content: space-between;
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 500;
        border-top: 1px solid var(--border-color);
        padding-top: 12px;
    }

    .action-btn { display: flex; align-items: center; gap: 6px; }

    /* --- App 图标区 --- */
    .app-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        padding: 0 10px;
        margin-bottom: 30px;
    }

    .app-item {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .app-icon {
        width: 60px;
        height: 60px;
        background-color: var(--placeholder-bg);
        border-radius: 14px;
        margin-bottom: 8px;
        background-size: cover;
        background-position: center;
        cursor: pointer;
        transition: transform 0.1s;
    }
    .app-icon:active { transform: scale(0.95); }

    .app-name {
        font-size: 13px;
        color: var(--text-main);
        text-align: center;
        min-width: 40px;
    }

    /* --- 搜索栏 & 胶囊 --- */
    .search-container {
        display: flex;
        justify-content: center;
        margin-top: auto; 
        margin-bottom: 25px;
    }

    .search-bar {
        background-color: #e5e5ea;
        color: #8e8e93;
        border-radius: 20px;
        padding: 6px 16px;
        font-size: 14px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }

    .svg-icon-search { width: 16px; height: 16px; fill: #8e8e93; }

    .dock {
        background-color: rgba(209, 209, 214, 0.8);
        backdrop-filter: blur(10px);
        border-radius: 32px;
        padding: 12px;
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 10px;
    }

    .dock-icon {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background-color: var(--placeholder-bg);
        background-size: cover;
        background-position: center;
        cursor: pointer;
    }

    /* ==================================================== */
    /* --- 全屏管理界面样式 --- */
    /* ==================================================== */
    #manager-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: var(--bg-color);
        z-index: 1000;
        display: none;
        flex-direction: column;
        padding: 20px;
        overflow-y: auto;
    }

    #manager-screen.active { display: flex; }

    .manager-header {
        display: flex;
        align-items: center;
        margin-bottom: 30px;
        padding: 0 10px;
    }

    .back-btn {
        background: none;
        border: none;
        font-size: 16px;
        color: var(--blue);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0;
    }

    .manager-title {
        flex-grow: 1;
        text-align: center;
        font-weight: 600;
        font-size: 17px;
        margin-right: 50px;
    }

    .manager-section-title {
        font-size: 14px;
        color: var(--text-secondary);
        margin: 20px 10px 10px;
        font-weight: 500;
    }

    .manager-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px 10px;
        padding: 0 10px;
    }
    
    .manager-grid.dock-grid {
        display: flex;
        justify-content: flex-start;
        gap: 30px;
    }

    .manager-grid.dock-grid .dock-icon {
        background-color: var(--placeholder-bg);
    }

    [contenteditable="true"] {
        outline: none;
        background-color: rgba(0, 122, 255, 0.1);
        border-radius: 4px;
        cursor: text;
    }

    /* 设置按钮区 */
    .settings-group {
        margin-top: 20px;
        padding: 0 10px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 40px;
    }

    .setting-btn {
        background-color: #ffffff;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 14px;
        font-size: 15px;
        color: var(--text-main);
        text-align: center;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        transition: background-color 0.2s;
    }
    .setting-btn:active { background-color: #f0f0f0; }

    .setting-btn.danger {
        color: #ff3b30;
        border-color: #ffd6d6;
    }
    .setting-btn.danger:active {
        background-color: #fff0f0;
    }

    /* ==================================================== */
    /* --- 讯言 App 界面样式 --- */
    /* ==================================================== */
    #xunyan-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #ffffff; /* 图片背景是纯白 */
        z-index: 2000;
        display: none;
        flex-direction: column;
        overflow-y: auto;
    }

    #xunyan-screen.active { display: flex; }

    /* 顶部导航栏 */
    .xy-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 24px;
    }
    
    .xy-header svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: #555;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        cursor: pointer;
    }

    /* 个人信息区 */
    .xy-profile-section {
        display: flex;
        padding: 10px 24px 30px;
        gap: 20px;
    }

    /* 头像缩小 */
    .xy-avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background-color: #555; /* 初始深色 */
        background-size: cover;
        background-position: center;
        cursor: pointer;
        flex-shrink: 0;
    }

    .xy-info {
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex-grow: 1;
    }

    .xy-name {
        font-size: 20px;
        font-weight: 600;
        color: #1c1c1e;
        margin: 0 0 4px 0;
    }

    .xy-role {
        font-size: 13px;
        color: #8e8e93;
        margin: 0 0 12px 0;
    }

    .xy-divider {
        width: 40px;
        height: 2px;
        background-color: #b0c4de;
        margin-bottom: 16px;
    }

    .xy-stats {
        display: flex;
        gap: 24px;
    }

    .xy-stat-item {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .xy-stat-num {
        font-size: 16px;
        font-weight: 600;
        color: #1c1c1e;
    }

    .xy-stat-label {
        font-size: 11px;
        color: #1c1c1e;
        margin-top: 2px;
    }

    /* 四个功能按钮区 */
    .xy-actions-row {
        display: flex;
        justify-content: space-between;
        padding: 10px 30px 30px;
        border-bottom: 1px solid #f0f0f0;
    }

    .xy-action-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        cursor: pointer;
    }

    .xy-action-btn svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: #555;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .xy-action-btn span {
        font-size: 12px;
        color: #8e8e93;
    }

    /* Messages 区 */
    .xy-messages-section {
        padding: 24px;
    }

    .xy-msg-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .xy-msg-header h2 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
    }

    .xy-msg-header span {
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }

    /* 隐藏的文件输入 */
    #file-upload { display: none; }
    #import-file { display: none; }
    
    /* 讯言界面的独立文件输入，防止冲突 */
    #xy-file-upload { display: none; }
</style>
</head>
<body>

<div class="app-container">
    <div class="widget-row">
        <div class="widget-item">
            <div class="widget-box" id="widget-img-1"></div>
            <div class="widget-label editable" data-key="widget-label-1">暂无文本描述</div>
        </div>
        <div class="widget-item">
            <div class="widget-box" id="widget-img-2"></div>
        </div>
        <div class="widget-item">
            <div class="widget-box" id="widget-img-3"></div>
            <div class="widget-label" id="live-time"></div>
        </div>
    </div>

    <div class="post-card">
        <div class="post-header">
            <div class="avatar" id="avatar-img"></div>
            <div class="user-info">
                <div class="username editable" data-key="username">暂无文本描述 <span id="verify-badge"></span></div>
                <div class="post-time editable" data-key="post-time">暂无文本描述</div>
            </div>
            <div class="more-icon">...</div>
        </div>
        <div class="post-content">
            <div class="editable" data-key="text-english">我们回到一切安稳 一切都来得及的时候吧 只要不是现在</div>
            <div class="translation editable" data-key="text-translation">暂无文本描述</div>
        </div>
        <div class="post-actions">
            <div class="action-btn">
                <svg style="width:18px;height:18px;fill:#8e8e93;" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                <span class="editable" data-key="action-repost">Repost</span>
            </div>
            <div class="action-btn">
                <svg style="width:18px;height:18px;fill:#8e8e93;" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg>
                <span class="editable" data-key="action-comments">Comments</span>
            </div>
            <div class="action-btn">
                <svg style="width:18px;height:18px;fill:#8e8e93;" viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
                <span class="editable" data-key="action-likes">Likes</span>
            </div>
        </div>
    </div>

    <div class="app-grid">
        <!-- 讯言 App 添加点击事件进入新界面 -->
        <div class="app-item" onclick="openXunyan()">
            <div class="app-icon" id="home-icon-1"></div>
            <div class="app-name" id="home-name-1">讯言</div>
        </div>
        <div class="app-item">
            <div class="app-icon" id="home-icon-2"></div>
            <div class="app-name" id="home-name-2">见面</div>
        </div>
        <div class="app-item">
            <div class="app-icon" id="home-icon-3"></div>
            <div class="app-name" id="home-name-3">通讯录</div>
        </div>
        <div class="app-item" onclick="openManager()">
            <div class="app-icon" id="home-icon-4"></div>
            <div class="app-name" id="home-name-4">桌面</div>
        </div>
    </div>

    <div class="search-container">
        <div class="search-bar">
            <svg class="svg-icon-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            搜索
        </div>
    </div>

    <div class="dock">
        <div class="dock-icon" id="home-dock-1"></div>
        <div class="dock-icon" id="home-dock-2"></div>
    </div>
</div>

<!-- ================= 桌面管理界面 ================= -->
<div id="manager-screen">
    <div class="manager-header">
        <button class="back-btn" onclick="closeManager()">
            <svg style="width:20px;height:20px;fill:#007aff;" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            返回桌面
        </button>
        <div class="manager-title">桌面管理</div>
    </div>

    <div class="manager-section-title">桌面 App</div>
    <div class="manager-grid">
        <div class="app-item">
            <div class="app-icon manager-upload-btn" id="mg-icon-1" data-target="1"></div>
            <div class="app-name manager-editable" id="mg-name-1" data-target="1">讯言</div>
        </div>
        <div class="app-item">
            <div class="app-icon manager-upload-btn" id="mg-icon-2" data-target="2"></div>
            <div class="app-name manager-editable" id="mg-name-2" data-target="2">见面</div>
        </div>
        <div class="app-item">
            <div class="app-icon manager-upload-btn" id="mg-icon-3" data-target="3"></div>
            <div class="app-name manager-editable" id="mg-name-3" data-target="3">通讯录</div>
        </div>
        <div class="app-item">
            <div class="app-icon manager-upload-btn" id="mg-icon-4" data-target="4"></div>
            <div class="app-name manager-editable" id="mg-name-4" data-target="4">桌面</div>
        </div>
    </div>

    <div class="manager-section-title">底部App</div>
    <div class="manager-grid dock-grid">
        <div class="app-item">
            <div class="dock-icon manager-upload-btn" id="mg-dock-1" data-target="d1"></div>
        </div>
        <div class="app-item">
            <div class="dock-icon manager-upload-btn" id="mg-dock-2" data-target="d2"></div>
        </div>
    </div>

    <div class="manager-section-title">美化与设置</div>
    <div class="settings-group">
        <button class="setting-btn" id="btn-change-wallpaper">
            <svg style="width:18px;height:18px;fill:#007aff;" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            更换桌面壁纸
        </button>
        <button class="setting-btn" id="btn-export">
            <svg style="width:18px;height:18px;fill:#34c759;" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            导出桌面美化
        </button>
        <button class="setting-btn" id="btn-import">
            <svg style="width:18px;height:18px;fill:#ff9500;" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
            导入桌面美化
        </button>
        <button class="setting-btn danger" id="btn-reset-wallpaper">
            <svg style="width:18px;height:18px;fill:#ff3b30;" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
            恢复默认桌面壁纸
        </button>
        <button class="setting-btn danger" id="btn-reset-apps">
            <svg style="width:18px;height:18px;fill:#ff3b30;" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
            恢复默认图标与名称
        </button>
    </div>
</div>

<!-- ================= 讯言 App 界面 ================= -->
<div id="xunyan-screen">
    <!-- 顶部图标 -->
    <div class="xy-header">
        <!-- 菜单图标兼返回功能 -->
        <svg onclick="closeXunyan()" viewBox="0 0 24 24">
            <path d="M3 12h18M3 6h18M3 18h18"></path>
        </svg>
        <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
    </div>

    <!-- 个人信息 -->
    <div class="xy-profile-section">
        <div class="xy-avatar" id="xy-avatar"></div>
        <div class="xy-info">
            <div class="xy-name xy-editable" data-key="xy_name">暂无文本输入</div>
            <div class="xy-role xy-editable" data-key="xy_role">暂无文本输入</div>
            <div class="xy-divider"></div>
            <div class="xy-stats">
                <div class="xy-stat-item">
                    <div class="xy-stat-num xy-editable" data-key="xy_posts">128</div>
                    <div class="xy-stat-label">Posts</div>
                </div>
                <div class="xy-stat-item">
                    <div class="xy-stat-num xy-editable" data-key="xy_followers">2.4K</div>
                    <div class="xy-stat-label">Followers</div>
                </div>
                <div class="xy-stat-item">
                    <div class="xy-stat-num xy-editable" data-key="xy_following">512</div>
                    <div class="xy-stat-label">Following</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 四个功能按钮 -->
    <div class="xy-actions-row">
        <div class="xy-action-btn">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Bout</span>
        </div>
        <div class="xy-action-btn">
            <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
            <span>Portfolio</span>
        </div>
        <div class="xy-action-btn">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            <span>Blog</span>
        </div>
        <div class="xy-action-btn">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <span>Contact</span>
        </div>
    </div>

    <!-- Messages 区 -->
    <div class="xy-messages-section">
        <div class="xy-msg-header">
            <h2>Messages</h2>
            <span>See all</span>
        </div>
        <!-- 联系人列表留空 -->
    </div>
</div>

<!-- 隐藏的输入框 -->
<input type="file" id="file-upload" accept="image/*">
<input type="file" id="import-file" accept=".json,application/json">
<input type="file" id="xy-file-upload" accept="image/*">

<script>
    // ==========================================
    // 1. IndexedDB 大容量数据库封装
    // ==========================================
    const DB_NAME = 'AppImageDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'images';

    function initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME);
                }
            };
            request.onsuccess = (e) => resolve(e.target.result);
            request.onerror = (e) => reject(e.target.error);
        });
    }

    async function saveImageToDB(key, base64Data) {
        const db = await initDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const req = store.put(base64Data, key);
            req.onsuccess = () => resolve();
            req.onerror = (e) => reject(e.target.error);
        });
    }

    async function getImageFromDB(key) {
        const db = await initDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const req = store.get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = (e) => reject(e.target.error);
        });
    }

    async function deleteImageFromDB(key) {
        const db = await initDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const req = store.delete(key);
            req.onsuccess = () => resolve();
            req.onerror = (e) => reject(e.target.error);
        });
    }

    async function getAllImagesFromDB() {
        const db = await initDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const req = store.getAll();
            const keysReq = store.getAllKeys();
            
            tx.oncomplete = () => {
                const result = {};
                for(let i=0; i<keysReq.result.length; i++) {
                    result[keysReq.result[i]] = req.result[i];
                }
                resolve(result);
            };
            tx.onerror = (e) => reject(e.target.error);
        });
    }

    async function clearImageDB() {
        const db = await initDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            store.clear();
            tx.oncomplete = () => resolve();
            tx.onerror = (e) => reject(e.target.error);
        });
    }

    // ==========================================
    // 2. 系统时间
    // ==========================================
    function updateLiveTime() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('live-time').innerText = `${hours}:${minutes}`;
    }
    setInterval(updateLiveTime, 1000);
    updateLiveTime();

    // ==========================================
    // 3. 界面开关控制
    // ==========================================
    const managerScreen = document.getElementById('manager-screen');
    function openManager() { managerScreen.classList.add('active'); }
    function closeManager() { managerScreen.classList.remove('active'); }

    const xunyanScreen = document.getElementById('xunyan-screen');
    function openXunyan() { xunyanScreen.classList.add('active'); }
    function closeXunyan() { xunyanScreen.classList.remove('active'); }


    // ==========================================
    // 4. App 数据配置与渲染
    // ==========================================
    const defaultApps = [
        { id: '1', name: '讯言', isDock: false },
        { id: '2', name: '见面', isDock: false },
        { id: '3', name: '通讯录', isDock: false },
        { id: '4', name: '桌面', isDock: false },
        { id: 'd1', name: '', isDock: true },
        { id: 'd2', name: '', isDock: true }
    ];

    async function renderApps() {
        for (const app of defaultApps) {
            const savedName = localStorage.getItem(`app_name_${app.id}`);
            const finalName = savedName !== null ? savedName : app.name;

            const savedImg = await getImageFromDB(`app_img_${app.id}`);

            if (!app.isDock) {
                const homeNameEl = document.getElementById(`home-name-${app.id}`);
                const homeIconEl = document.getElementById(`home-icon-${app.id}`);
                if (homeNameEl) homeNameEl.innerText = finalName;
                
                if (homeIconEl) {
                    if (savedImg) homeIconEl.style.backgroundImage = `url(${savedImg})`;
                    else homeIconEl.style.backgroundImage = 'none';
                }
                
                const mgNameEl = document.getElementById(`mg-name-${app.id}`);
                const mgIconEl = document.getElementById(`mg-icon-${app.id}`);
                if (mgNameEl) mgNameEl.innerText = finalName;
                
                if (mgIconEl) {
                    if (savedImg) mgIconEl.style.backgroundImage = `url(${savedImg})`;
                    else mgIconEl.style.backgroundImage = 'none';
                }
            } else {
                const homeDockEl = document.getElementById(`home-dock-${app.id === 'd1' ? '1' : '2'}`);
                const mgDockEl = document.getElementById(`mg-dock-${app.id === 'd1' ? '1' : '2'}`);
                
                if (homeDockEl) {
                    if (savedImg) homeDockEl.style.backgroundImage = `url(${savedImg})`;
                    else homeDockEl.style.backgroundImage = 'none';
                }
                if (mgDockEl) {
                    if (savedImg) mgDockEl.style.backgroundImage = `url(${savedImg})`;
                    else mgDockEl.style.backgroundImage = 'none';
                }
            }
        }
    }

    // ==========================================
    // 5. 文字双击编辑 (通用)
    // ==========================================
    function setupEditableText(elements) {
        elements.forEach(el => {
            const key = el.dataset.key;
            const savedText = localStorage.getItem(key);
            if (savedText) el.innerHTML = savedText;

            el.addEventListener('dblclick', function(e) {
                e.stopPropagation();
                this.contentEditable = "true";
                this.focus();
                const range = document.createRange();
                const sel = window.getSelection();
                range.selectNodeContents(this);
                range.collapse(false);
                sel.removeAllRanges();
                sel.addRange(range);
            });

            el.addEventListener('blur', function() {
                this.contentEditable = "false";
                localStorage.setItem(key, this.innerHTML);
            });
        });
    }

    // 桌面管理文字
    document.querySelectorAll('.manager-editable').forEach(el => {
        el.addEventListener('dblclick', function(e) {
            e.stopPropagation();
            this.contentEditable = "true";
            this.focus();
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(this);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
        });

        el.addEventListener('blur', function() {
            this.contentEditable = "false";
            const appId = this.dataset.target;
            const newName = this.innerText.trim();
            localStorage.setItem(`app_name_${appId}`, newName);
            document.getElementById(`home-name-${appId}`).innerText = newName;
        });
    });

    // 主页帖子文字 & 讯言界面文字
    setupEditableText(document.querySelectorAll('.editable, .xy-editable'));

    // ==========================================
    // 6. 图片上传逻辑
    // ==========================================
    const fileInput = document.getElementById('file-upload');
    let currentUploadTarget = null;

    document.querySelectorAll('.manager-upload-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            currentUploadTarget = { type: 'app', id: this.dataset.target };
            fileInput.click();
        });
    });

    function setupHomeImageUpload(elementId) {
        const el = document.getElementById(elementId);
        el.addEventListener('click', () => {
            currentUploadTarget = { type: 'other', id: elementId };
            fileInput.click();
        });
    }
    
    setupHomeImageUpload('widget-img-1');
    setupHomeImageUpload('widget-img-2');
    setupHomeImageUpload('widget-img-3');
    setupHomeImageUpload('avatar-img');

    document.getElementById('btn-change-wallpaper').addEventListener('click', () => {
        currentUploadTarget = { type: 'wallpaper', id: 'wallpaper' };
        fileInput.click();
    });

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file && currentUploadTarget) {
            const reader = new FileReader();
            reader.onload = async function(event) {
                const base64Data = event.target.result;
                let dbKey = '';

                if (currentUploadTarget.type === 'app') {
                    dbKey = `app_img_${currentUploadTarget.id}`;
                } else if (currentUploadTarget.type === 'wallpaper') {
                    dbKey = 'app_wallpaper';
                } else {
                    dbKey = `other_img_${currentUploadTarget.id}`;
                }

                await saveImageToDB(dbKey, base64Data);

                if (currentUploadTarget.type === 'app') {
                    await renderApps(); 
                } else if (currentUploadTarget.type === 'wallpaper') {
                    document.body.style.backgroundImage = `url(${base64Data})`;
                } else {
                    const el = document.getElementById(currentUploadTarget.id);
                    if (el) el.style.backgroundImage = `url(${base64Data})`;
                }
                
                fileInput.value = '';
            };
            reader.readAsDataURL(file);
        }
    });

    // ==========================================
    // 7. 讯言专属头像上传逻辑
    // ==========================================
    const xyFileInput = document.getElementById('xy-file-upload');
    document.getElementById('xy-avatar').addEventListener('click', () => {
        xyFileInput.click();
    });

    xyFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = async function(event) {
                const base64Data = event.target.result;
                await saveImageToDB('xunyan_avatar', base64Data);
                document.getElementById('xy-avatar').style.backgroundImage = `url(${base64Data})`;
                xyFileInput.value = '';
            };
            reader.readAsDataURL(file);
        }
    });

    // ==========================================
    // 8. 导出/导入 & 恢复默认数据
    // ==========================================
    document.getElementById('btn-export').addEventListener('click', async () => {
        try {
            const lsData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                lsData[key] = localStorage.getItem(key);
            }
            const dbData = await getAllImagesFromDB();

            const exportPayload = {
                version: 1.0,
                timestamp: Date.now(),
                localStorage: lsData,
                indexedDB: dbData
            };

            const dataStr = "data:application/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportPayload));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", `desktop_beautify_${new Date().getTime()}.json`);
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            
            alert("导出成功！请保存好下载的 JSON 文件。");
        } catch (err) {
            console.error(err);
            alert("导出失败，请重试。");
        }
    });

    const importFileInput = document.getElementById('import-file');
    document.getElementById('btn-import').addEventListener('click', () => {
        importFileInput.click();
    });

    importFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(event) {
            try {
                const importedData = JSON.parse(event.target.result);
                
                if (!importedData.localStorage || !importedData.indexedDB) {
                    throw new Error("无效的美化文件格式");
                }

                await clearImageDB();
                localStorage.clear();
                
                for (const [key, value] of Object.entries(importedData.localStorage)) {
                    localStorage.setItem(key, value);
                }

                const imagePromises = [];
                for (const [key, base64] of Object.entries(importedData.indexedDB)) {
                    imagePromises.push(saveImageToDB(key, base64));
                }
                await Promise.all(imagePromises);

                alert("导入成功！点击确定后将刷新页面以应用新配置。");
                location.reload();

            } catch (err) {
                console.error(err);
                alert("导入失败：文件可能已损坏或格式不正确。");
            }
            importFileInput.value = '';
        };
        reader.readAsText(file);
    });

    document.getElementById('btn-reset-wallpaper').addEventListener('click', async () => {
        if(confirm("确定要恢复默认桌面壁纸吗？")) {
            await deleteImageFromDB('app_wallpaper');
            localStorage.removeItem('wallpaper');
            document.body.style.backgroundImage = 'none';
        }
    });

    document.getElementById('btn-reset-apps').addEventListener('click', async () => {
        if(confirm("确定要将所有App（桌面及底部）恢复为默认的图标和名称吗？")) {
            defaultApps.forEach(app => {
                localStorage.removeItem(`app_name_${app.id}`);
            });

            const keysToDelete = ['app_img_1', 'app_img_2', 'app_img_3', 'app_img_4', 'app_img_d1', 'app_img_d2'];
            for (let key of keysToDelete) {
                await deleteImageFromDB(key);
            }

            await renderApps();
            alert("已恢复默认图标和名称！");
        }
    });

    // ==========================================
    // 9. 初始化加载
    // ==========================================
    async function initApp() {
        await renderApps();
        
        const wallpaperImg = await getImageFromDB('app_wallpaper');
        if (wallpaperImg) {
            document.body.style.backgroundImage = `url(${wallpaperImg})`;
        }

        const avatarImg = await getImageFromDB('other_img_avatar-img');
        if (avatarImg) document.getElementById('avatar-img').style.backgroundImage = `url(${avatarImg})`;

        for (let i = 1; i <= 3; i++) {
            const widgetImg = await getImageFromDB(`other_img_widget-img-${i}`);
            if (widgetImg) document.getElementById(`widget-img-${i}`).style.backgroundImage = `url(${widgetImg})`;
        }

        // 讯言 App 头像初始化
        const xyAvatarImg = await getImageFromDB('xunyan_avatar');
        if (xyAvatarImg) {
            document.getElementById('xy-avatar').style.backgroundImage = `url(${xyAvatarImg})`;
        }

        const badgeSvg = `<svg style="width:16px;height:16px;fill:#007aff;margin-left:4px;vertical-align:middle;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>`;
        document.getElementById('verify-badge').innerHTML = badgeSvg;
    }

    initApp();
</script>
</body>
